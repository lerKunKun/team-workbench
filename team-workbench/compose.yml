name: team-workbench
services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${WORKBENCH_DB_PASSWORD:?set a private hex password}
      POSTGRES_DB: workbench
    healthcheck:
      test: [CMD, pg_isready, '-U', workbench, '-d', workbench, '-h', '127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [db:/var/lib/postgresql/data]
    networks: [storage]
  api:
    build: ./api
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    environment:
      WORKBENCH_DATABASE_URL: postgres://workbench:${WORKBENCH_DB_PASSWORD}@postgres:5432/workbench?sslmode=disable
      WORKBENCH_ORIGIN: ${WORKBENCH_ORIGIN:-http://localhost:3100}
      WORKBENCH_ADMIN_ORIGIN: ${WORKBENCH_ADMIN_ORIGIN:-}
      WORKBENCH_LISTEN: ':8091'
      WORKBENCH_MODE: ${WORKBENCH_MODE:-demo}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEST_TEAM_ID: ${LINEAR_TEST_TEAM_ID:-}
      LINEAR_TEST_PROJECT_ID: ${LINEAR_TEST_PROJECT_ID:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_QR_REDIRECT_URL: ${DINGTALK_QR_REDIRECT_URL:-}
      WORKBENCH_BOT_TOKEN: ${WORKBENCH_BOT_TOKEN:-}
      ROADMAP_FEEDBACK_KEY: ${ROADMAP_FEEDBACK_KEY:-}
      ROADMAP_SSO_KEY: ${ROADMAP_SSO_KEY:-}
      ROADMAP_PROJECT_MAP: ${ROADMAP_PROJECT_MAP:-}
      ROADMAP_OPERATOR_ID: ${ROADMAP_OPERATOR_ID:-}
      ROADMAP_DISPATCH_KEY: ${ROADMAP_DISPATCH_KEY:-}
      ROADMAP_HOOK_KEY: ${ROADMAP_HOOK_KEY:-}
    ports: ['127.0.0.1:${WORKBENCH_API_PORT:-8091}:8091']
    networks: [storage, app]
    read_only: true
    tmpfs: ['/tmp:mode=1777,size=2m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, wget, '-qO', /dev/null, 'http://127.0.0.1:8091/api/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build: ./web
    restart: unless-stopped
    ports: ['127.0.0.1:${WORKBENCH_WEB_PORT:-3100}:3000']
    networks: [app]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  preview:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    volumes: ['./ops/preview.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${WORKBENCH_PREVIEW_PORT:-3111}:8080']
    networks: [app]
volumes:
  db:
networks:
  storage: {internal: true}
  app:
